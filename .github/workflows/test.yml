name: Starter checks
"on": [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y php-cli php-zip php-curl unzip
      - run: sh tooling/scripts/setup-packaging.sh
      - run: php -l tooling/scripts/archive-check.php && sh tooling/tests/packaging.sh
